name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: leticiaitoq
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

Clique em **"Commit changes"** para salvar.

---

### 4. Rode a Action manualmente pela primeira vez
1. Vá na aba **"Actions"** do seu repositório
2. No menu lateral, clique em **"generate animation"**
3. Clique no botão **"Run workflow"** → **"Run workflow"** (botão verde)
4. Aguarde uns 30–60 segundos até aparecer o ✅ verde

---

### 5. Verifique se funcionou
Após rodar, vai aparecer uma branch chamada **`output`** no seu repositório. Dentro dela você verá os arquivos:
```
github-contribution-grid-snake.svg
github-contribution-grid-snake-dark.svg
